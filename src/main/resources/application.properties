spring.application.name=Pi.Na - MKT

spring.datasource.url=jdbc:h2:file:./data/apipina
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

spring.web.error.include-binding-errors=always
spring.web.error.include-message=always

springdoc.swagger-ui.tagsSorter=alpha

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=100MB

# Microsserviço de calendário (calendar-service)
calendar.service.base-url=http://localhost:8081
spring.application.name=Pi.Na - MKT

spring.datasource.url=jdbc:h2:file:./data/apipina
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

spring.web.error.include-binding-errors=never
spring.web.error.include-message=never

springdoc.swagger-ui.tagsSorter=alpha

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Chave de assinatura JWT: defina JWT_SECRET no ambiente. Nunca versione a chave real.
jwt.secret=${JWT_SECRET:PiNaProjetoFaculdadeChaveSuperSecreta2026!!!}

# Origens permitidas para CORS (sobrescreva CORS_ALLOWED_ORIGINS em produção).
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200,http://localhost:8080}

# Administrador inicial: defina ADMIN_PASSWORD no ambiente para provisionar a conta.
admin.email=${ADMIN_EMAIL:admin@pina.com}
admin.password=${ADMIN_PASSWORD:}

# Microsserviço de calendário (calendar-service)
calendar.service.base-url=http://localhost:8081
